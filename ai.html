<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="ai.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="user-profile">
                <div class="profile-image">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2>AI Assistant</h2>
                <p class="status">Online</p>
                <p class="creator">Created by Safa Thasnim</p>
            </div>
            
            <nav class="menu">
                <button class="menu-item active" data-view="chat">
                    <i class="fas fa-comments"></i>
                    Chat
                </button>
                <button class="menu-item" data-view="tasks">
                    <i class="fas fa-tasks"></i>
                    Tasks
                </button>
                <button class="menu-item" data-view="reminders">
                    <i class="fas fa-bell"></i>
                    Reminders
                </button>
                <button class="menu-item" data-view="preferences">
                    <i class="fas fa-cog"></i>
                    Preferences
                </button>
            </nav>

            <div class="memory-status">
                <h3>Memory Status</h3>
                <div class="memory-bar">
                    <div class="memory-fill"></div>
                </div>
                <p>Memory Usage: <span id="memory-usage">0%</span></p>
            </div>
        </aside>

        <main class="main-content">
            <div class="chat-container">
                <div class="chat-header">
                    <h1>AI Assistant</h1>
                    <div class="input-methods">
                        <button class="input-method-btn" data-method="text">
                            <i class="fas fa-keyboard"></i>
                        </button>
                        <button class="input-method-btn" data-method="voice">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button class="input-method-btn" data-method="image">
                            <i class="fas fa-image"></i>
                        </button>
                    </div>
                </div>

                <div class="chat-messages" id="chat-messages">
                    <div class="message assistant">
                        <div class="message-content">
                            <p>Hello! I'm your AI assistant. How can I help you today?</p>
                        </div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>

                <div class="chat-input">
                    <div class="input-container">
                        <textarea id="user-input" placeholder="Type your message..."></textarea>
                        <button id="send-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="input-options">
                        <button class="option-btn" title="Attach File">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <button class="option-btn" title="Record Voice">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button class="option-btn" title="Upload Image">
                            <i class="fas fa-image"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="tasks-container" style="display: none;">
                <h2>Tasks</h2>
                <div class="tasks-list" id="tasks-list">
                    <!-- Tasks will be added here dynamically -->
                </div>
                <button class="add-task-btn">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>

            <div class="reminders-container" style="display: none;">
                <h2>Reminders</h2>
                <div class="reminders-list" id="reminders-list">
                    <!-- Reminders will be added here dynamically -->
                </div>
                <button class="add-reminder-btn">
                    <i class="fas fa-plus"></i> Add Reminder
                </button>
            </div>

            <div class="preferences-container" style="display: none;">
                <h2>Preferences</h2>
                <div class="preferences-form">
                    <div class="preference-group">
                        <label>Voice Assistant</label>
                        <select id="voice-preference">
                            <option value="male">Male Voice</option>
                            <option value="female">Female Voice</option>
                        </select>
                    </div>
                    <div class="preference-group">
                        <label>Theme</label>
                        <select id="theme-preference">
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                        </select>
                    </div>
                    <div class="preference-group">
                        <label>Memory Duration</label>
                        <select id="memory-duration">
                            <option value="1">1 Day</option>
                            <option value="7">1 Week</option>
                            <option value="30">1 Month</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal" id="task-modal">
        <div class="modal-content">
            <h2>Add New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Task Title</label>
                    <input type="text" id="task-title" required>
                </div>
                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea id="task-description"></textarea>
                </div>
                <div class="form-group">
                    <label for="task-due-date">Due Date</label>
                    <input type="datetime-local" id="task-due-date">
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="submit" class="save-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="reminder-modal">
        <div class="modal-content">
            <h2>Add New Reminder</h2>
            <form id="reminder-form">
                <div class="form-group">
                    <label for="reminder-title">Reminder Title</label>
                    <input type="text" id="reminder-title" required>
                </div>
                <div class="form-group">
                    <label for="reminder-time">Time</label>
                    <input type="datetime-local" id="reminder-time" required>
                </div>
                <div class="form-group">
                    <label for="reminder-repeat">Repeat</label>
                    <select id="reminder-repeat">
                        <option value="none">None</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="submit" class="save-btn">Save Reminder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add footer with copyright -->
    <footer class="footer">
        <p>&copy; 2024 AI Personal Assistant | Created by Safa Thasnim</p>
    </footer>

    <script src="ai.js"></script>
</body>
</html>
